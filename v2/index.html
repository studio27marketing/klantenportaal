/* PWA: service worker + AUTOMATISCHE harde update.
   Doel: na élke nieuwe publicatie landt ELKE gebruiker (ook geïnstalleerde PWA met caching)
   gegarandeerd op de nieuwe versie, zónder handmatig verversen.
   Werking: de sw.js draagt een versie-gebonden CACHE-naam. Bij een nieuwe deploy haalt de
   browser /sw.js opnieuw op (no-cache _headers + updateViaCache:'none'), de nieuwe SW
   installeert (skipWaiting) en neemt meteen de controle over (clients.claim) -> 'controllerchange'
   vuurt -> we herladen één keer naar de verse assets. Een gedeelde guard voorkomt reload-lussen. */
(function(){
  window.__s27reloading = false;
  window.__s27reload = function(){
    if(window.__s27reloading) return;
    window.__s27reloading = true;
    setTimeout(function(){ try{ location.reload(); }catch(e){} }, 200);
  };
  if(!('serviceWorker' in navigator)) return;
  // Was er al een SW aan de controle? Dan is een 'controllerchange' een UPDATE (wel herladen).
  // Bij de allereerste installatie was er nog geen controller -> die eerste keer NIET herladen.
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(hadController) window.__s27reload();
    hadController = true;
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function(reg){
      try{ reg.update(); }catch(e){}                                   // meteen op een nieuwe versie checken
      setInterval(function(){ try{ reg.update(); }catch(e){} }, 30*60*1000);
      document.addEventListener('visibilitychange', function(){       // PWA terug op de voorgrond = check
        if(document.visibilityState==='visible'){ try{ reg.update(); }catch(e){} }
      });
    }).catch(function(){});
  });
})();
</script>
