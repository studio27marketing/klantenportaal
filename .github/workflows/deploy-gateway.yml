name: Deploy gateway (s27-portal-gateway)

# Deployt de Cloudflare Worker `s27-portal-gateway` (map gateway/) naar de live worker.
# Vereist twee repository-secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   scoped token: Account > Workers Scripts: Edit + D1: Edit
#                          (+ Workers KV Storage: Edit als je KV-rate-limiting houdt)
#   CLOUDFLARE_ACCOUNT_ID  je Cloudflare account-id (Workers & Pages -> rechterkolom)
#
# De binding CRMDB (D1: s27-crm-db) en de var D1_ENDPOINTS staan al in gateway/wrangler.toml.
# Worker-SECRETS (GATEWAY_SECRET, ADMIN_SECRET, SA_*) blijven behouden bij een deploy.
# LET OP: een eventuele KV-binding die alleen via het dashboard is gezet wordt vervangen door
# wat in wrangler.toml staat -> uncomment daar het [[kv_namespaces]]-blok als je KV gebruikt.

on:
  push:
    branches: [main, claude/hub-portaal-integration-sirpwu]
    paths:
      - 'gateway/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          # default command = "deploy"; wrangler.toml levert name/binding/vars.
