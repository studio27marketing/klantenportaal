<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:#F7F3EA;color:#050A30;font-family:'Outfit',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#D1F24C;color:#050A30}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#DFD9C8;border-radius:99px;border:3px solid #F7F3EA}
  ::-webkit-scrollbar-thumb:hover{background:#C4BEAC}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .fu{animation:fadeUp .42s cubic-bezier(.16,1,.3,1) both}
  .lift{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s cubic-bezier(.2,.8,.2,1)}
  .lift:hover{transform:translateY(-3px);box-shadow:0 10px 30px -10px rgba(5,10,48,.13)}
  .nav-i{transition:background .14s,color .14s}
  .nav-i:hover{background:#EFEADD}
  .nav-d{transition:background .14s,color .14s}
  .nav-d:hover{background:rgba(247,243,234,.08)}
  .tap{transition:transform .12s,background .14s,box-shadow .14s,opacity .14s}
  .tap:active{transform:scale(.97)}
  .tap:hover{filter:brightness(.97)}
  .lnk{transition:color .14s}
  .lnk:hover{color:#0F2EA3;text-decoration:underline}
  .colcard{transition:transform .16s,box-shadow .16s,border-color .16s}
  .colcard:hover{box-shadow:0 8px 22px -10px rgba(5,10,48,.16);border-color:#C4BEAC}
  .colcard:active{cursor:grabbing}
  .dz-over{background:#EAEEFB !important;outline:2px dashed #2458EA;outline-offset:-6px}
  .wk-cell{transition:background .12s}
  .wk-cell.dz-over{background:#EAEEFB !important}
  .wk-cell:hover{background-color:rgba(36,88,234,.10) !important;cursor:pointer}
  .mo-cell{transition:background .12s}
  .mo-cell:hover{background-color:rgba(36,88,234,.07) !important;cursor:pointer}
  .asg-w .asg-x{opacity:0;transition:opacity .12s}
  .asg-w:hover .asg-x{opacity:1}
  input,select,textarea,button{font-family:inherit}

  componentDidMount(){

    if(this._embed==='weekplanner'){ this.setState({screen:'weekplanner', sbExpand:false}); this._stripChrome(); this._startHeightSync(); }

    }catch(e){}

      return true;
    }catch(e){return false;} };
    if(!apply()){ let n=0; const iv=setInterval(()=>{ if(apply()||++n>20) clearInterval(iv); },60); } }
  _startHeightSync(){ if(typeof window==='undefined'||window.parent===window)return;

  wkResizeStart(e,id,edge,HH){
    e.preventDefault(); e.stopPropagation();
    const t=this.byId(id); if(!t) return;
    const startY=e.clientY;
    const origDurH=Math.max(0.25,this.estHours(t));
    const sl=Object.assign({day:0,hour:9,min:0},(this.state.schedule||{})[id]||{});
    const origStartQ=sl.hour*4 + Math.round((sl.min||0)/15);
    const minHour=8;
    this._wkResizing=true;
    const move=(ev)=>{
      const dq=Math.round((ev.clientY-startY)/(HH/4));
      if(edge==='bottom'){
        const newDur=Math.max(0.25, origDurH + dq*0.25);
        const t2=this.byId(id); if(t2){ t2.est=Math.round(newDur*60); t2.estBy=null; }
        this.forceUpdate();
      } else {
        let newStartQ=origStartQ + dq;
        let newDur=origDurH - dq*0.25;
        if(newDur<0.25){ newDur=0.25; newStartQ=origStartQ + Math.round((origDurH-0.25)*4); }
        let nh=Math.floor(newStartQ/4), nm=(newStartQ%4)*15;
        if(nh<minHour){ nh=minHour; nm=0; }
        const t2=this.byId(id); if(t2){ t2.est=Math.round(newDur*60); t2.estBy=null; }
        this.setState(s=>({schedule:Object.assign({},s.schedule,{[id]:Object.assign({},s.schedule[id],{hour:nh,min:nm})})}));
      }
    };
    const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); setTimeout(()=>{this._wkResizing=false;},50); try{this._persistSchedule(id);var _t=this.byId(id);if(_t)this._save(id,{est_min:_t.est});}catch(e){} this.forceUpdate(); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  }

  _isoP(ms){ if(ms==null||ms==='') return null; try{ var d=new Date(Number(ms)); if(isNaN(d.getTime())) return null; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch(e){ return null; } }

  mapLiveTask(t){ var comp=(this._compById&&t.company_id)?this._compById[t.company_id]:null; var klant=comp?comp.naam:(t.company_id?'Klant':'Intern'); var pr=String(t.priority||'medium'); if(['low','medium','high'].indexOf(pr)<0) pr='medium'; return { id:t.id, name:t.name||'', klant:klant, belangrijk:!!(comp&&comp.belangrijk), type:t.type_job||'', branch:t.branch||'web', org:t.org||'S27', status:t.status||'op-te-starten', priority:pr, pm:t.pm||'', people:Array.isArray(t.people)?t.people:[], budget:Number(t.budget)||0, regie:!!t.regie, start:this._isoP(t.start), deadline:this._isoP(t.deadline), est:Number(t.est_min)||0, brief:t.brief||'', parent:t.parent_id||null, company_id:t.company_id||'', drive:t.drive||(comp&&comp.drive)||'', rating:Number(t.rating)||0, pmveld:t.pm_veld||'', fbstatus:t.fb_status||'', fblink:t.fb_link||'', project_id:t.project_id||'', contact_id:t.contact_id||'', candidate_id:t.candidate_id||'', vacature_id:t.vacature_id||'', wedding_id:t.wedding_id||'', offerte_id:t.offerte_id||'', archived:!!t.archived, ticket:!!t.is_ticket, comments:[], files:[] }; }
  /* belangrijke-klant-marker: gele/groene ster naast de klantnaam wanneer de taak voor een belangrijke klant is */
  belImportant(t){ if(!t) return false; if(t.belangrijk) return true; try{ var m=this._compById||{}; for(var k in m){ if(m[k]&&m[k].naam===t.klant) return !!m[k].belangrijk; } }catch(e){} return false; }
  belStar(t,sz){ if(!this.belImportant(t)) return null; sz=sz||13; return React.createElement('span',{title:'Belangrijke klant',style:{display:'inline-flex',alignItems:'center',flex:'none',marginLeft:4,verticalAlign:'middle'}}, this.ic('star',sz,'#9AB814')); }
  loadLive(){ var self=this; if(this._preview||typeof window==='undefined'||!window.S27TeamAuth) return; window.S27TeamAuth.token().then(function(tok){ if(!tok) return null; return fetch(self._gw()+'/prodData',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:'{}'}).then(function(r){return r.json();}); }).then(function(d){ if(!d||!d.ok) return; self._live=d; self._compById={}; (d.companies||[]).forEach(function(c){ self._compById[c.id]=c; }); self._members=d.members||[]; var tasks=(d.tasks||[]).map(self.mapLiveTask.bind(self)); var wk=null; try{ wk=self.WEEK(); }catch(e){} var sched={}; if(wk){ (d.tasks||[]).forEach(function(t){ if(t.plan_start){ var ds=new Date(Number(t.plan_start)); for(var i=0;i<7;i++){ if(wk[i].toDateString()===ds.toDateString()){ sched[t.id]={day:i,hour:ds.getHours(),min:ds.getMinutes()}; break; } } } }); } var patch={tasks:tasks, schedule:sched}; if(d.me){ patch.me=(String(d.me.naam||'').split(/\s+/)[0])||self.state.me; var mgmt=(d.me.teams&&d.me.teams.indexOf('management')>=0)||d.me.role==='admin'||d.me.role==='accountmanager'||d.me.role==='sales'; patch.role=mgmt?'manager':'teamlid'; } self.setState(patch, function(){ try{ self.publishSearch&&self.publishSearch(); }catch(e){} if(self._pendingOpen&&self.byId(self._pendingOpen)){ self.open(self._pendingOpen,self._pendingTab,true); self._pendingOpen=null; self._pendingTab=null; } if(self.state.screen==='weekplanner'||self.state.screen==='agenda'){ try{ self.loadAgenda(); }catch(e){} } }); }).catch(function(){}); }
  _startAuth(){ var self=this, tries=0; (function wait(){ if(typeof window!=='undefined'&&window.S27TeamAuth){ try{ window.S27TeamAuth.init({gatewayBase:self._gw()}); }catch(e){} window.S27TeamAuth.subscribe(function(st){ if(!st) return; if(st.phase==='ready'){ if(!self._loaded){ self._loaded=true; self.loadLive(); } } else if(st.phase==='signed_out'){ try{ location.replace('/?next='+encodeURIComponent('/productie/'+(location.search||'')+(location.hash||''))); }catch(e){} } }); return; } if(tries++<80) setTimeout(wait,80); })(); }
  componentDidMount(){ var self=this; var preview=false, emb=null; if(typeof window!=='undefined'){ try{ var sp=new URLSearchParams(location.search); var lp=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(location.hostname); emb=sp.get('embed')||null; preview=lp&&(sp.get('preview')==='1'||sp.get('demo')==='1'); }catch(e){} } this._preview=preview; this._embed=emb;
    if(emb==='weekplanner'){ this.setState({screen:'weekplanner', sbExpand:false}); try{this._stripChrome();this._startHeightSync();}catch(e){} }
    if(emb==='aibtns'){ this.setState({screen:'ai-acties', role:'manager', sbExpand:false}); try{this._stripChrome();this._startHeightSync();}catch(e){} }
    if(!preview && !emb){ this._startAuth(); }
    this._iv=setInterval(function(){ if(self.state.timer) self.setState(function(s){return {nowTick:s.nowTick+1};}); },1000);
    try{ var rt=this._readRoute?this._readRoute():{}; if(rt.screen) this.setState({screen:this._cleanScreen(rt.screen)}); if(rt.id){ this._pendingOpen=rt.id; this._pendingTab=rt.tab||'beschrijving'; if(this.byId(rt.id)) this.open(rt.id,this._pendingTab,true); } }catch(e){}
    try{ this.publishSearch(); }catch(e){}
    if(typeof window!=='undefined'){ this._onResize=function(){ self.setState({vw:window.innerWidth}); }; window.addEventListener('resize',this._onResize); this._onRoute=function(){ try{ self._applyRoute(); }catch(e){} }; window.addEventListener('popstate',this._onRoute); window.addEventListener('hashchange',this._onRoute); } }
  logout(){ try{ if(window.S27TeamAuth&&window.S27TeamAuth.logout) window.S27TeamAuth.logout(); }catch(e){} try{ localStorage.removeItem('s27_auth'); }catch(e){} try{ location.replace('/'); }catch(e){} }
  renderProfiel(){ var h=React.createElement; return h('div',{className:'fu',style:{padding:'14px 20px 30px'}}, h('iframe',{src:'Profiel.dc.html?embed=1&user='+encodeURIComponent(this.FULLNAME(this.state.me)||this.state.me||''),title:'Mijn profiel',style:{width:'100%',border:'none',display:'block',minHeight:'600px',background:'transparent'},onLoad:function(e){ try{ var d=e.target.contentWindow.document; var set=function(){ try{ e.target.style.height=(d.body.scrollHeight+20)+'px'; }catch(_){} }; set(); setTimeout(set,300); setTimeout(set,800); }catch(_){} }})); }

  /* menubalk-AI: echte chat via teamAssistantChat */
  sendAI(){ var self=this; var v=(this.state.aiInput||'').trim(); var att=(this.state.aiAttach||[]).slice(); if(!v&&!att.length) return; this.setState(function(s){ return {aiInput:'',aiAttach:[],aiChats:s.aiChats.map(function(c){ if(c.id!==s.aiActiveId) return c; var isFirst=c.messages.filter(function(m){return m.role==='me';}).length===0; var nm=(isFirst&&v)?(v.length>42?v.slice(0,42)+'…':v):c.name; return Object.assign({},c,{name:nm,when:'Nu',messages:c.messages.concat([{role:'me',text:v,att:att},{role:'ai',text:'…'}])}); })}; });
    if(this._preview||typeof window==='undefined'||!window.S27TeamAuth){ this._aiReplace('Login vereist om de AI te gebruiken.'); return; }
    var ctx='Productie-portaal, scherm: '+this.state.screen+'.'; var aid=this.state.aiActiveId;
    window.S27TeamAuth.token().then(function(tok){ if(!tok) return null; return fetch(self._gw()+'/teamAssistantChat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({portal:'productie',message:v,context:ctx,session_id:(self._aiSess||'')})}).then(function(r){return r.json();}); }).then(function(d){ var reply=(d&&d.reply)||'Geen antwoord.'; if(d&&d.session_id) self._aiSess=d.session_id; self._aiReplace(reply, aid); }).catch(function(){ self._aiReplace('Er ging iets mis.'); }); }
  _aiReplace(text,aid){ this.setState(function(s){ return {aiChats:s.aiChats.map(function(c){ if(c.id!==(aid||s.aiActiveId)) return c; var msgs=c.messages.slice(); for(var i=msgs.length-1;i>=0;i--){ if(msgs[i].role==='ai'&&msgs[i].text==='…'){ msgs[i]=Object.assign({},msgs[i],{text:String(text)}); break; } } return Object.assign({},c,{messages:msgs}); })}; }); }
  /* taakveld-edits → prodTaskPatch (real-time, debounced) */
  setStatus(id,st){ var t=this.byId(id); if(!t) return; t.status=st; this.recalcParent(t); this.forceUpdate(); this._save(id,{status:st}); }
  setType(id,val){ var t=this.byId(id); if(!t) return; t.type=val; this.setState({barPop:null}); this.toast('Type job: '+val); this._save(id,{type_job:val}); }
  setOrg(id,val){ var t=this.byId(id); if(!t) return; t.org=val; this.setState({barPop:null}); this.toast('Organisatie: '+val); this._save(id,{org:val}); }
  toggleRegie(id){ var t=this.byId(id); if(t){ t.regie=!t.regie; if(t.regie&&(t.uurtarief==null||t.uurtarief==='')){ t.uurtarief=100; } this.setState({}); this._save(id,{regie:t.regie}); } }
  setDeadline(id,val){ var t=this.byId(id); if(!t) return; t.deadline=val; t.deadlineStart=null; this.forceUpdate(); this._save(id,{deadline:this._toMs(val)}); }
  setDeadlineRange(id,a,b){ var t=this.byId(id); if(!t) return; if(!a){ t.deadline=''; t.deadlineStart=null; } else if(!b||b===a){ t.deadline=a; t.deadlineStart=null; } else { var lo=a<b?a:b, hi=a<b?b:a; t.deadlineStart=lo; t.deadline=hi; } this.setState({dlPick:null}); this._save(id,{deadline:this._toMs(t.deadline), start:this._toMs(t.deadlineStart)}); }
  setEst(id,hours){ var t=this.byId(id); if(!t) return; var h=parseFloat(hours); if(!isNaN(h)&&h>=0){ t.est=Math.round(h*60); t.estBy=null; } this.forceUpdate(); this._save(id,{est_min:t.est}); }
  setEstBy(id,person,hours){ var t=this.byId(id); if(!t) return; var h=parseFloat(hours); t.estBy=t.estBy||{}; if(hours===''||isNaN(h)){ delete t.estBy[person]; } else if(h>=0){ t.estBy[person]=Math.round(h*60); } var vals=Object.values(t.estBy); if(vals.length) t.est=vals.reduce(function(a,b){return a+b;},0); this.forceUpdate(); this._save(id,{est_min:t.est}); }
  togglePerson(id,name){ var t=this.byId(id); if(!t) return; var p=t.people?t.people.slice():[]; var i=p.indexOf(name); if(i>=0) p.splice(i,1); else p.push(name); t.people=p; this.forceUpdate(); this._save(id,{people:p}); }

  setTaskText(id,f,v){ var t=this.byId(id); if(t){ t[f]=v; this.setState({}); var col=({pmveld:'pm_veld',brief:'brief'})[f]; if(col){ var pp={}; pp[col]=v; this._save(id,pp); } } }
  /* weekplanner: planning-persistentie (prodWeekplan) + live Google Agenda (teamWeekplanner) */
  _persistSchedule(id){ if(!this._loaded||!id) return; var sl=(this.state.schedule||{})[id]; var t=this.byId(id); if(!sl||!t){ try{ this.apiPost('prodWeekplan',{id:id,plan_start:null,plan_end:null}); }catch(e){} return; } var wk; try{ wk=this.WEEK(); }catch(e){ return; } var d=wk[sl.day]; if(!d) return; var start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),sl.hour||0,sl.min||0,0,0).getTime(); var durMin=Number(t.est)||Math.round((this.estHours(t)||1)*60); var end=start+durMin*60000; try{ this.apiPost('prodWeekplan',{id:id,plan_start:start,plan_end:end}); }catch(e){} }
  _clearSchedule(id){ if(this._loaded&&id){ try{ this.apiPost('prodWeekplan',{id:id,plan_start:null,plan_end:null}); }catch(e){} } }
  loadAgenda(force){ var self=this; if(this._preview||typeof window==='undefined'||!window.S27TeamAuth) return; var wk; try{ wk=this.WEEK(); }catch(e){ return; } var van=new Date(wk[0]); van.setHours(0,0,0,0); var tot=new Date(wk[6]); tot.setHours(23,59,59,999); var names=(this.state.wkPeople&&this.state.wkPeople.length)?this.state.wkPeople:[this.state.me]; var ids=[]; (this._members||[]).forEach(function(m){ var fn=String(m.naam||'').split(/\s+/)[0]; if(names.indexOf(m.naam)>=0||names.indexOf(fn)>=0) ids.push(m.id); }); var key=van.getTime()+'|'+names.join(','); if(!force&&this._wkAgKey===key&&this.state.wkAgenda) return; this._wkAgKey=key; var body={van_ms:van.getTime(),tot_ms:tot.getTime(),tasks:false,calendar:true}; if(ids.length) body.member_ids=ids; this.apiPost('teamWeekplanner',body).then(function(d){ if(!d||!d.ok) return; var weekDays=wk.map(function(x){return x.toDateString();}); var evs=[]; (d.members||[]).forEach(function(m){ (m.events||[]).forEach(function(ev){ if(ev.allday) return; var sm=Number(ev.start_ms)||0, em=Number(ev.eind_ms)||0; var s=new Date(sm), e=new Date(em); var day=weekDays.indexOf(s.toDateString()); if(day<0) return; var dur=Math.max(0.25,(e-s)/3600000); evs.push({ id:m.id+'_'+ev.id, eventId:String(ev.id||''), memberId:m.id, canEdit:Number(m.id)===Number(d.me_id), who:m.naam, day:day, hour:s.getHours(), min:s.getMinutes(), dur:dur, title:ev.titel||'Afspraak', where:ev.locatie||'', link:ev.link||'', startMs:sm, endMs:em }); }); }); self.setState({wkAgenda:evs}); }).catch(function(){}); }

  wkTogglePerson(p){ var self=this; this.setState(function(s){ var cur=(s.wkPeople&&s.wkPeople.length)?s.wkPeople.slice():[self.state.me]; var i=cur.indexOf(p); if(i>=0){ if(cur.length>1) cur.splice(i,1); } else cur.push(p); return {wkPeople:cur}; }, function(){ try{ self.loadAgenda(true); }catch(e){} }); }
