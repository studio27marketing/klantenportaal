name = "s27-portal-gateway"
main = "worker.js"
compatibility_date = "2024-11-01"

# Niet-geheime variabelen. GATEWAY_SECRET NOOIT hier — zet via:
#   npx wrangler secret put GATEWAY_SECRET
[vars]
PROJECT_ID = "studio27-cloud"
ALLOWED_ORIGINS = "https://www.studio27.be,https://studio27.be"
# D1-migratie (zie AUDIT_HUB_MIGRATION.md): per-endpoint feature-flag.
# LEEG ("[]") = ALLES blijft via Make/ClickUp lopen, ZERO gedragsverandering.
# Zet keys pas aan NA een pariteitstest (Make vs D1), bv.:
#   D1_ENDPOINTS = '["meetingsList","bedrijfBeheer:get_team","bedrijfBeheer:get_offertes","bedrijfContent"]'
# LIVE-SET (gebruiker: "zet live"): de gevalideerde reads + eigen chat (greenfield).
# Na deploy: smoke-test elke key op ORISON (86c8cz2qb) — de gateway valt bij elke D1-fout/leegte
# automatisch terug op Make, en rollback = key uit deze lijst halen.
#   - dashboard  : NOG NIET aanzetten (tasks nog niet gesynct — zie task-backfill).
#   - writes     : facturatieSave / bedrijfBeheer:update_bedrijf|update_contact zijn AAN (P4):
#                  schrijven naar D1 + stempelen portal_overrides zodat de sync ze niet overschrijft.
#                  Falen ze (bedrijf/contact niet in D1) -> automatische fallback naar Make/ClickUp.
#   - chat-bijlagen: chatAttachment blijft nog op Make (R2-mediaroute volgt) — tekstchat werkt wel.
D1_ENDPOINTS = '["meetingsList","bedrijfBeheer:get_team","bedrijfBeheer:get_offertes","bedrijfContent","chatList","chatPost","facturatieSave","bedrijfBeheer:update_bedrijf","bedrijfBeheer:update_contact"]'
# Optioneel: echte Studio 27 booking-deeplink voor meetingsList. Zonder deze var
# laat meetingsList booking_url weg en valt de frontend terug op de DM/booking-modal.
# MEETINGS_BOOKING_URL = "https://..."

# Rate limiting + sleutel-cache. Maak de namespace aan met:
#   npx wrangler kv namespace create KV
# en plak het gegenereerde id hieronder, dan deze 3 regels uncommenten:
# [[kv_namespaces]]
# binding = "KV"
# id = "PLAK_KV_NAMESPACE_ID_HIER"

# D1-databank van de hub (s27-crm-db). Vereist zodra een endpoint in D1_ENDPOINTS staat.
# Met D1_ENDPOINTS="[]" wordt deze binding niet gebruikt — toevoegen is gedragsneutraal.
[[d1_databases]]
binding = "CRMDB"
database_name = "s27-crm-db"
database_id = "0c50db87-9a69-4cdc-9f43-4c1dc92dd801"
