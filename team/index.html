<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Studio 27 · Teamportaal</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#3083DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S27 Team">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://s27-portal-gateway-v2.studio27marketing.workers.dev">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="auth.js?v=2">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<link rel="stylesheet" href="glass.css?v=2">
<link rel="stylesheet" href="team.css?v=2">
</head>
<body>

<!-- BOOT -->
<div id="boot" class="boot"><div class="spin"></div><span id="boot-msg">Teamportaal laden…</span></div>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="login-card">
    <div class="login-welkom">Welkom bij het</div>
    <img class="lwordmark" src="wordmark.svg" alt="Studio 27" style="height:30px;margin:0 auto 4px;display:block">
    <div class="llab">Teamportaal</div>
    <button class="oauth-btn" id="btn-google">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Inloggen met Google
    </button>
    <p class="login-err" id="login-err"></p>
    <p class="micro">Alleen voor @studio27.be-medewerkers.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head"><img class="sb-wordmark" src="wordmark.svg" alt="Studio 27" style="height:24px;display:block"></div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>

  <header class="topbar">
    <button class="hamb" id="hamb" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="crumb"><span class="crumb-home">Teamportaal</span><svg class="crumb-sep" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="crumb-section" id="crumb">Home</span></div>
    <div class="top-right">
      <div class="live-tag"><span class="live-dot"></span><span id="live-name">Live</span></div>
    </div>
  </header>
  <div class="sb-scrim" id="sbScrim"></div>

  <main class="page" id="page"></main>
</div>

<!-- PROJECT DETAIL MODAL -->
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="auth.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
